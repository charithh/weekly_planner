<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Projects — Weekly Planner">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#007bff">
    <title>Projects — Weekly Planner</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">

    <!-- Firebase SDK v9 modular -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        window.firebase = { initializeApp, getFirestore, getAuth };
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="min-h-screen">

        <!-- Header -->
        <header class="bg-white shadow-sm border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <a href="index.html" class="inline-flex items-center gap-2 px-3 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-colors">
                            ‹ Planner
                        </a>
                        <h1 class="text-lg font-semibold text-gray-900">Projects</h1>
                    </div>
                    <div class="flex items-center gap-4">
                        <div id="syncStatus" class="flex items-center gap-2">
                            <span id="syncIndicator" class="w-2 h-2 rounded-full bg-red-500"></span>
                            <span id="syncText" class="text-sm text-gray-600">Offline</span>
                        </div>
                        <div id="authContainer"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

            <!-- Toolbar -->
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <label class="flex items-center gap-2 text-sm text-gray-600 cursor-pointer select-none">
                        <input type="checkbox" id="showCompletedProjects" class="rounded border-gray-300">
                        Show completed
                    </label>
                </div>
                <button id="addProjectBtn" class="inline-flex items-center px-3 py-2 bg-blue-500 text-white text-sm font-medium rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors">
                    + Add Project
                </button>
            </div>

            <!-- Filter Bar -->
            <div class="bg-white border border-gray-200 rounded-lg px-4 py-3 mb-4 space-y-2">
                <div class="flex flex-wrap items-center gap-2">
                    <input type="text" id="filterSearch" placeholder="Search projects…"
                        class="px-3 py-1.5 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-44 shrink-0">

                    <select id="filterStatus"
                        class="px-3 py-1.5 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 shrink-0">
                        <option value="all">All statuses</option>
                        <option value="active">Active</option>
                        <option value="completed">Completed</option>
                    </select>

                    <button id="clearFiltersBtn" class="hidden px-3 py-1.5 text-sm text-red-600 border border-red-200 rounded-md hover:bg-red-50 transition-colors shrink-0">
                        Clear filters
                    </button>
                </div>
            </div>

            <!-- Projects Table -->
            <div class="bg-white border border-gray-200 rounded-lg overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Project Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Target Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Related Roles</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="projectsTableBody" class="divide-y divide-gray-200">
                            <!-- Projects will be rendered here -->
                        </tbody>
                    </table>
                    <div id="emptyState" class="text-center py-12">
                        <p class="text-gray-500 text-sm">No projects yet. <button id="emptyAddProject" class="text-blue-600 hover:underline">Create your first project</button></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Project Modal -->
    <div id="projectModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h2 id="projectModalTitle" class="text-xl font-semibold text-gray-900">Add Project</h2>
                <span id="closeProjectModal" class="cursor-pointer text-2xl text-gray-400 hover:text-gray-600 transition-colors leading-none">&times;</span>
            </div>

            <form id="projectForm" class="space-y-4">
                <input type="hidden" id="projectModalId">

                <!-- Project Name -->
                <div>
                    <label for="projectModalName" class="block text-sm font-medium text-gray-700 mb-1">Project Name <span class="text-red-500">*</span></label>
                    <input type="text" id="projectModalName" placeholder="e.g., Website Redesign" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>

                <!-- Description -->
                <div>
                    <label for="projectModalDescription" class="block text-sm font-medium text-gray-700 mb-1">Description <span class="text-red-500">*</span></label>
                    <textarea id="projectModalDescription" placeholder="What is this project about?" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
                </div>

                <!-- Target Completion Date -->
                <div>
                    <label for="projectModalTargetDate" class="block text-sm font-medium text-gray-700 mb-1">Target Completion Date <span class="text-red-500">*</span></label>
                    <input type="date" id="projectModalTargetDate" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>

                <!-- Related Roles -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Related Roles <span class="text-red-500">*</span></label>
                    <div id="projectRolesContainer" class="space-y-2 border border-gray-200 rounded-md p-3 max-h-40 overflow-y-auto">
                        <!-- Role checkboxes will be rendered here -->
                    </div>
                </div>

                <!-- Status -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-2">
                            <input type="radio" name="projectStatus" value="active" checked class="rounded border-gray-300">
                            <span class="text-sm text-gray-700">Active</span>
                        </label>
                        <label class="flex items-center gap-2">
                            <input type="radio" name="projectStatus" value="completed" class="rounded border-gray-300">
                            <span class="text-sm text-gray-700">Completed</span>
                        </label>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-3 justify-end pt-4 border-t border-gray-200">
                    <button type="button" id="cancelProjectBtn" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
                        Cancel
                    </button>
                    <button type="button" id="deleteProjectBtn" class="hidden px-4 py-2 border border-red-300 rounded-md text-sm font-medium text-red-700 bg-red-50 hover:bg-red-100 focus:outline-none focus:ring-2 focus:ring-red-500 transition-colors">
                        Delete
                    </button>
                    <button type="submit" id="saveProjectBtn" class="px-4 py-2 bg-blue-500 text-white text-sm font-medium rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
                        Save Project
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification -->
    <div id="notificationContainer" class="fixed bottom-4 right-4 z-40 space-y-3 max-w-sm"></div>

    <script type="module" src="firebase-service.js"></script>
    <script src="projects.js"></script>
</body>
</html>
